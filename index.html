<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbf7f1">
<title>CN Booking Studio｜線上預約平台</title>
<style>
:root{--ink:#382922;--muted:#806f63;--cream:#fbf7f1;--paper:#fffdf9;--gold:#b8955c;--line:#e8dcd0}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.7}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.top{padding:24px 0;border-bottom:1px solid var(--line)}.brand{font:700 24px Georgia,serif}.brand small{display:block;font:10px sans-serif;letter-spacing:.2em;color:var(--muted)}main{padding:42px 0}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold)}h1{font:700 clamp(30px,6vw,44px)/1.25 Georgia,"Noto Serif TC",serif;margin:10px 0}.muted{color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;margin:18px 0}.btn{display:inline-block;text-decoration:none;border-radius:999px;padding:12px 19px;background:var(--ink);color:white;margin:8px 8px 0 0}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.small{font-size:12px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
</style></head>
<body><header class="top"><div class="wrap"><div class="brand">CN Booking Studio<small>ONLINE BOOKING · BUSINESS TOOLS</small></div></div></header>
<main class="wrap"><div class="eyebrow">MULTI-STORE BOOKING PLATFORM</div><h1>讓預約與店家管理，簡單一點。</h1><p class="muted">平台管理員統一管理店家；顧客透過店家專屬連結預約，不需要建立平台帳號。</p>
<section class="panel"><h2>平台管理入口</h2><p class="muted">管理員登入後可建立店家、查看店家清單及進入店家管理後台。</p><a class="btn" href="./platform.html">進入平台管理</a></section>
<section class="panel"><h2>預約流程展示</h2><p class="muted">目前展示版僅供介面預覽，資料暫存於目前裝置，並非正式雲端預約。</p><a class="btn secondary" href="./demo.html">查看展示版</a></section>
<p class="small">正式顧客預約頁與各店家專屬網址，將在雲端預約流程完成後啟用。</p></main><footer>© 2026 CN Booking Studio</footer></body></html>
