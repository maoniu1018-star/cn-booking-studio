<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CN Booking Studio｜店家後台</title>
<style>
:root{--ink:#382922;--muted:#806f63;--cream:#fbf7f1;--paper:#fffdf9;--gold:#b8955c;--line:#e8dcd0;--green:#53765e}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.6}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line)}.brand{font:700 20px Georgia,serif}.brand small{display:block;font:10px sans-serif;letter-spacing:.2em;color:var(--muted)}main{padding:28px 0 55px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0}h1{font:700 clamp(26px,5vw,38px) Georgia,serif;margin:8px 0}h2{font-size:19px;margin:0 0 12px}.muted,.small{color:var(--muted)}.small{font-size:12px}.btn,input,select{font:inherit}.btn{border:1px solid var(--line);border-radius:999px;padding:9px 15px;background:white;color:var(--ink);cursor:pointer}.primary{background:var(--ink);color:white}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:13px;background:#f8efe8;border-radius:12px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.table{overflow:auto}.hours-row{display:grid;grid-template-columns:1.2fr .8fr 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.hours-row input[type=time]{min-width:0}.closure-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:600px){.hours-row{grid-template-columns:1fr 1fr}.hours-row strong{grid-column:1/-1}}table{width:100%;border-collapse:collapse;min-width:620px;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.tag{padding:3px 8px;border-radius:999px;background:#f4eadf;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}.msg{padding:12px;background:#f6ebe3;border-radius:10px;margin-top:10px}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:16px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:10px}}
</style></head>
<body><header class="top"><div class="wrap"><div class="brand">CN Booking Studio<small>BUSINESS DASHBOARD</small></div></div></header>
<main class="wrap"><a href="./platform.html" class="small">← 返回店家列表</a><h1 id="businessTitle">店家管理</h1><div id="status" class="muted">正在載入…</div>
<section class="panel"><h2>顧客預約網址</h2><p class="muted">新增至少一項服務後，顧客即可透過此網址預約。</p><div class="field"><input id="publicBookingUrl" readonly aria-label="顧客預約網址"></div><div class="actions"><button class="btn" id="copyBookingUrl" type="button">複製網址</button><a class="btn" id="openBookingUrl" target="_blank" rel="noopener">預覽預約頁</a></div><div id="bookingLinkMsg" class="small" style="margin-top:8px"></div></section>
<section class="panel"><h2>預約概況</h2><div class="stats"><div class="stat"><b id="total">0</b><span>全部預約</span></div><div class="stat"><b id="pending">0</b><span>待確認</span></div><div class="stat"><b id="confirmed">0</b><span>已確認</span></div><div class="stat"><b id="cancelled">0</b><span>已取消</span></div></div></section>
<section class="panel"><h2>新增服務項目</h2><form id="serviceForm"><div class="grid"><div class="field"><label>服務名稱</label><input id="serviceName" required maxlength="80" placeholder="例如：初次諮詢"></div><div class="field"><label>服務時間（分鐘）</label><input id="duration" type="number" min="5" max="720" value="60" required></div></div><div class="grid"><div class="field"><label>價格（可留空）</label><input id="price" type="number" min="0" step="1" placeholder="不填表示未定價"></div><div class="field"><label>服務說明</label><input id="serviceDescription" maxlength="300" placeholder="簡短說明"></div></div><button class="btn primary">新增服務</button></form><div id="serviceMsg"></div><div id="servicesList" class="small" style="margin-top:12px"></div></section>
<section class="panel"><h2>營業時間設定</h2><p class="muted">設定每週營業日與每日可預約時段，儲存後會同步套用到顧客預約頁。</p><div id="hoursRows"></div><button class="btn primary" id="saveHours" type="button">儲存營業時間</button><div id="hoursMsg" class="small" style="margin-top:10px"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>特殊休假日</h2><p class="small">新增後，顧客在該日期無法送出預約。</p><form id="closureForm"><div class="grid"><div class="field"><label for="closureDate">休假日期</label><input id="closureDate" type="date" required></div><div class="field"><label for="closureNote">備註（選填）</label><input id="closureNote" maxlength="100" placeholder="例如：私人行程"></div></div><button class="btn" type="submit">新增休假日</button></form><div id="closureMsg" class="small" style="margin-top:8px"></div><div id="closuresList" class="small"></div></section>
<section class="panel"><h2>預約管理</h2><div class="field"><label>日期篩選</label><input id="dateFilter" type="date"></div><div class="table"><table><thead><tr><th>日期／時間</th><th>顧客</th><th>聯絡方式</th><th>服務</th><th>顧客備註</th><th>狀態</th><th>操作</th></tr></thead><tbody id="bookingRows"></tbody></table></div><div id="empty" class="muted">目前沒有預約資料。</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let sb=null,businessId=new URLSearchParams(location.search).get('business'),services=[];
function cfg(){const u=sessionStorage.getItem('cn_sb_url'),k=sessionStorage.getItem('cn_sb_key');if(!u||!k){location.href='./platform.html';return false}sb=window.supabase.createClient(u,k);return true}
async function init(){if(!cfg())return;const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.href='./platform.html';return}if(!businessId){location.href='./platform.html';return}const {data:biz,error:be}=await sb.from('businesses').select('id,name,slug').eq('id',businessId).single();if(be){$('status').textContent='無法讀取店家資料：'+be.message;return}$('businessTitle').textContent=biz.name;const bookingUrl=new URL('./booking.html?store='+encodeURIComponent(biz.slug),location.href).href;$('publicBookingUrl').value=bookingUrl;$('openBookingUrl').href=bookingUrl;$('status').textContent='已登入｜店家資料僅限此店家成員查看';await loadAll();await loadHours()}
async function loadAll(){const [s,b]=await Promise.all([sb.from('services').select('*').eq('business_id',businessId).order('created_at'),sb.from('bookings').select('id,customer_name,customer_contact,appointment_date,start_time,status,service_id,notes').eq('business_id',businessId).order('appointment_date',{ascending:false})]);if(s.error){$('serviceMsg').textContent=s.error.message;return}services=s.data||[];const names=Object.fromEntries(services.map(x=>[x.id,x.name]));$('servicesList').textContent=services.length?'目前服務：'+services.map(x=>x.name+'（'+x.duration_minutes+' 分鐘）').join('、'):'尚未新增服務項目';if(b.error){$('status').textContent='預約讀取失敗：'+b.error.message;return}const rows=b.data||[];$('total').textContent=rows.length;$('pending').textContent=rows.filter(x=>x.status==='pending').length;$('confirmed').textContent=rows.filter(x=>x.status==='confirmed').length;$('cancelled').textContent=rows.filter(x=>x.status==='cancelled').length;renderBookings(rows,names)}
const dayNames=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
async function loadHours(){
 const [hr,cr]=await Promise.all([sb.from('business_hours').select('day_of_week,is_open,start_time,end_time').eq('business_id',businessId),sb.from('business_closures').select('id,closure_date,note').eq('business_id',businessId).order('closure_date')]);
 if(hr.error){$('hoursMsg').textContent='營業時間讀取失敗：'+hr.error.message;return}
 const byDay=Object.fromEntries((hr.data||[]).map(x=>[x.day_of_week,x]));
 $('hoursRows').innerHTML=dayNames.map((name,i)=>{const h=byDay[i]||{};return '<div class="hours-row"><strong>'+name+'</strong><label><input type="checkbox" data-open="'+i+'" '+(h.is_open?'checked':'')+'> 營業</label><input type="time" data-start="'+i+'" value="'+(h.start_time||'09:00').slice(0,5)+'" aria-label="'+name+'開始時間"><input type="time" data-end="'+i+'" value="'+(h.end_time||'18:00').slice(0,5)+'" aria-label="'+name+'結束時間"></div>'}).join('');
 $('closuresList').innerHTML='';(cr.data||[]).forEach(c=>{const row=document.createElement('div');row.className='closure-item';const label=document.createElement('span');label.textContent=c.closure_date+(c.note?'｜'+c.note:'');const btn=document.createElement('button');btn.className='btn';btn.textContent='移除';btn.addEventListener('click',async()=>{if(!confirm('確定移除此休假日？'))return;const {error}=await sb.from('business_closures').delete().eq('id',c.id).eq('business_id',businessId);if(error){$('closureMsg').textContent=error.message;return}await loadHours()});row.append(label,btn);$('closuresList').append(row)});
 $('closureDate').min=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
 if(cr.error)$('closureMsg').textContent='特殊休假日讀取失敗：'+cr.error.message;
}
$('saveHours').addEventListener('click',async()=>{
 const rows=dayNames.map((_,i)=>{const open=$('hoursRows').querySelector('[data-open="'+i+'"]').checked,start=$('hoursRows').querySelector('[data-start="'+i+'"]').value,end=$('hoursRows').querySelector('[data-end="'+i+'"]').value;return {business_id:businessId,day_of_week:i,is_open:open,start_time:open?start:null,end_time:open?end:null}});
 for(const r of rows){if(r.is_open&&(!r.start_time||!r.end_time||r.start_time>=r.end_time)){$('hoursMsg').textContent='營業日的結束時間必須晚於開始時間。';return}}
 const btn=$('saveHours');btn.disabled=true;const {error}=await sb.from('business_hours').upsert(rows,{onConflict:'business_id,day_of_week'});btn.disabled=false;$('hoursMsg').textContent=error?'儲存失敗：'+error.message:'營業時間已儲存，顧客預約頁將立即套用新設定。';if(!error)await loadHours();
});
$('closureForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.from('business_closures').insert({business_id:businessId,closure_date:$('closureDate').value,note:$('closureNote').value.trim()});if(error){$('closureMsg').textContent=error.code==='23505'?'這個日期已在休假清單中。':'新增失敗：'+error.message;return}$('closureForm').reset();$('closureMsg').textContent='特殊休假日已新增。';await loadHours()});
function contactCell(value){
 const td=document.createElement('td'),v=String(value||'').trim();
 if(!v){td.textContent='—';return td}
 const a=document.createElement('a');a.textContent=v;
 if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){a.href='mailto:'+v}
 else if(/^\+?[0-9\s()-]{7,}$/.test(v)){a.href='tel:'+v.replace(/[^+0-9]/g,'')}
 else {const id=v.replace(/^@/,'');a.href='https://line.me/R/ti/p/~'+encodeURIComponent(id);a.target='_blank';a.rel='noopener'}
 td.append(a);return td
}
function renderBookings(rows,names){const f=$('dateFilter').value;const filtered=rows.filter(r=>!f||r.appointment_date===f);$('bookingRows').innerHTML='';$('empty').classList.toggle('hidden',filtered.length>0);filtered.forEach(r=>{const tr=document.createElement('tr');const vals=[r.appointment_date+' '+String(r.start_time).slice(0,5),r.customer_name];vals.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});tr.append(contactCell(r.customer_contact));[names[r.service_id]||'服務項目',r.notes||'—',({pending:'待確認',confirmed:'已確認',cancelled:'已取消',completed:'已完成'})[r.status]||r.status].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});const td=document.createElement('td'),wrap=document.createElement('div');wrap.className='actions';const actions=r.status==='pending'?[['確認','confirmed'],['取消','cancelled']]:r.status==='confirmed'?[['完成','completed'],['取消','cancelled']]:[];if(!actions.length){const done=document.createElement('span');done.className='small';done.textContent=r.status==='cancelled'?'已取消，無可用操作':r.status==='completed'?'已完成':'—';wrap.append(done)}actions.forEach(([label,status])=>{const btn=document.createElement('button');btn.className='btn';btn.textContent=label;btn.addEventListener('click',async()=>{if(status==='cancelled'&&!confirm('確定取消這筆預約？'))return;btn.disabled=true;const {error}=await sb.from('bookings').update({status}).eq('id',r.id).eq('business_id',businessId);if(error){alert(error.message);btn.disabled=false}else loadAll()});wrap.append(btn)});td.append(wrap);tr.append(td);$('bookingRows').append(tr)})}
$('serviceForm').addEventListener('submit',async e=>{e.preventDefault();const payload={business_id:businessId,name:$('serviceName').value.trim(),duration_minutes:Number($('duration').value),description:$('serviceDescription').value.trim(),price:$('price').value===''?null:Number($('price').value)};const {error}=await sb.from('services').insert(payload);if(error){$('serviceMsg').textContent=error.message;return}$('serviceForm').reset();$('duration').value=60;$('serviceMsg').textContent='服務已新增';loadAll()});
$('copyBookingUrl').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('publicBookingUrl').value);$('bookingLinkMsg').textContent='已複製預約網址';}catch(e){$('publicBookingUrl').select();$('bookingLinkMsg').textContent='請長按上方網址並選擇複製';}});$('dateFilter').addEventListener('change',loadAll);init();
</script></body></html>
